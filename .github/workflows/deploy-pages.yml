name: Deploy to GitHub Pages

on:
  push:
    branches: [main, main-without-flip]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync magazine PDFs from Google Drive
        run: npm run sync:magazines

      - name: Build production
        run: npm run build

      - name: Prepare site folder
        run: |
          SITE_DIR="dist/rasamagazine-website/browser"
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          # Disable Jekyll so Angular assets/routes work
          touch "$SITE_DIR/.nojekyll"
          echo "rasamagazine.com" > "$SITE_DIR/CNAME"
          ls -la "$SITE_DIR"

      # Publishes ONLY the built site to the gh-pages branch
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/rasamagazine-website/browser
          force_orphan: true
          commit_message: 'Deploy site'
