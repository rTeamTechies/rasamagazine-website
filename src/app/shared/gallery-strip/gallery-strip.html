<div
  class="strip"
  role="region"
  [attr.aria-label]="label()"
  [class.is-lightbox-open]="lightboxSrc()"
>
  <div class="track" [style.--gallery-duration.s]="durationSeconds()">
    @for (image of images(); track image; let i = $index) {
      <button type="button" class="frame" (click)="open(image)" [attr.aria-label]="'View photo ' + (i + 1)">
        <img [src]="image" alt="" [loading]="loading(i)" decoding="async" draggable="false" />
      </button>
    }
    @for (image of images(); track image; let i = $index) {
      <button
        type="button"
        class="frame"
        aria-hidden="true"
        tabindex="-1"
        (click)="open(image)"
      >
        <img [src]="image" alt="" loading="lazy" decoding="async" draggable="false" />
      </button>
    }
  </div>
</div>

@if (lightboxSrc(); as src) {
  <div
    #lightboxPanel
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Enlarged photo"
    (click)="close()"
  >
    <button type="button" class="lightbox-close" aria-label="Close photo" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button>
    <img
      class="lightbox-image"
      [src]="src"
      alt="Enlarged gallery photo"
      (click)="$event.stopPropagation()"
      draggable="false"
    />
  </div>
}
