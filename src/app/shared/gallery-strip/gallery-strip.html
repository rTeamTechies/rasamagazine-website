<div class="strip" role="region" [attr.aria-label]="label()">
  <div class="track" [style.--gallery-duration.s]="durationSeconds()">
    @for (image of images(); track image; let i = $index) {
      <figure class="frame">
        <img [src]="image" alt="" [loading]="loading(i)" decoding="async" draggable="false" />
      </figure>
    }
    @for (image of images(); track image; let i = $index) {
      <figure class="frame" aria-hidden="true">
        <img [src]="image" alt="" loading="lazy" decoding="async" draggable="false" />
      </figure>
    }
  </div>
</div>
